<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <title>Cadastro de Vagas</title>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center font-[Roboto]">

<div class="flex flex-col items-center gap-8">

    <div class="flex justify-center items-center w-full gap-4">
        <img th:src="@{/images/vaga.png}" alt="Vaga" class="w-[32px] h-[32px]">
        <h1 class="text-slate-700 text-4xl font-semibold">
            Cadastro de Vagas
        </h1>
    </div>

    <form th:actions="@{/company/jobs}" th:object="${jobs}" method="post"
          class="w-full min-w-[28rem] max-w-md flex gap-24">
        <div class="w-full border space-y-4 bg-white rounded-md p-12 shadow">

            <div>
                <p class="text-gray-400">Por favor insira as informações da vaga</p>
                <h2 class="font-bold text-2xl text-slate-700">Cadastre sua vaga</h2>
            </div>

            <input type="text" name="name" th:field="*{name}"
                   class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-sky-600 focus:ring-2"
                   placeholder="Ex.: Vaga para Engenheiro de Software">
            <input type="text" name="level" th:field="*{level}"
                   class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-sky-600 focus:ring-2"
                   placeholder="Ex: Pleno">
            <input type="text" name="benefits" th:field="*{benefits}"
                   class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-sky-600 focus:ring-2"
                   placeholder="Ex: Gympass">
            <textarea placeholder="Digite uma breve descrição sobre a vaga" th:field="*{description}"
                      class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-sky-600 focus:ring-2">
            </textarea>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="w-full bg-sky-500 text-white p-3 rounded-md hover:bg-sky-600 transition-colors duration-200">
                Cadastrar
            </button>
        </div>
    </form>

</div>

</body>
</html>
