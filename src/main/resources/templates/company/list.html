<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <title>Vagas Criadas</title>
</head>
<body class="flex flex-col items-center my-12 gap-32 bg-slate-100 min-h-screen font-[Roboto]">

<nav class="bg-white border rounded-md p-4 shadow">
    <div class="space-x-4">
        <a href="/company/jobs"
           class="bg-slate-50 rounded-md px-3 py-2 hover:bg-slate-200 transition-colors duration-200">Cadastro</a>
        <a href="/company/jobs/list"
           class="bg-slate-200 rounded-md px-3 py-2">Listagem</a>
        <a href="/company/logout"
           class="bg-slate-50 rounded-md px-3 py-2 hover:bg-slate-200 transition-colors duration-200">Sair</a>
    </div>
</nav>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8 container mx-auto">
    <!--        <form action="" class="flex gap-4 justify-center">-->
    <!--            <input type="text" name="filter" placeholder="Busca de vaga"-->
    <!--                   class="w-96 bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-green-600 focus:ring-2">-->
    <!--            <button type="submit"-->
    <!--                    class="w-24 bg-green-500 text-white p-3 rounded-md hover:bg-green-600 transition-colors duration-200">-->
    <!--                Buscar-->
    <!--            </button>-->
    <!--        </form>-->


    <div class="bg-white rounded p-6 mb-4 shadow-md text-justify" th:each="job: ${jobs}">

        <div class="flex justify-between mb-4">
            <form th:action="@{/company/jobs/list/details}" method="get">

                <input type="hidden" name="jobId" th:value="${job.id}">

                <button type="submit"
                        class="w-24 bg-green-500 text-white p-3 rounded-md hover:bg-green-600 transition-colors duration-200">
                    Detalhes
                </button>

            </form>

            <form th:action="@{/company/jobs/list/delete}" method="post"
                  onsubmit="return confirm('Tem certeza que deseja excluir essa vaga?')">

                <input type="hidden" name="jobId" th:value="${job.id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <button type="submit"
                        class="w-24 bg-red-500 text-white p-3 rounded-md hover:bg-red-600 transition-colors duration-200">
                    Excluir
                </button>


            </form>
        </div>

        <div class="mb-4">
            <h2 class="text-2xl font-bold" th:text="${job.name}"></h2>
            <p th:text="${job.level}"></p>
        </div>

        <hr>

        <div class="mt-4">
            <p class="text-slate-500" th:text="${job.description}"></p>
            <p class="text-lg mt-4 font-bold">Benefícios</p>
            <p th:text="${job.benefits}"></p>
        </div>
    </div>


</div>

</body>
</html>
