<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <title>Cadastro de Usuário</title>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center font-[Roboto]">

<div class="w-lg flex flex-col items-center gap-8">

    <div class="flex justify-center items-center w-full gap-4">
        <img th:src="@{/images/logo.png}" alt="Logo" class="w-[32px] h-[32px]">
        <h1 class="text-slate-700 text-4xl font-semibold">
            Gestão de Vagas
        </h1>
    </div>

    <form th:action="@{/candidate/create}" th:object="${candidate}" method="post"
          class="w-full min-w-[28rem] max-w-md flex gap-24">
        <div class="w-full border space-y-4 bg-white rounded-md p-12 shadow">

            <div>
                <p class="text-gray-400">Por favor preencha seus dados</p>
                <h2 class="font-bold text-2xl text-slate-700">Seja bem vindo!</h2>
            </div>

            <input type="text" name="name" th:field="*{name}"
                   class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-green-600 focus:ring-2"
                   placeholder="Nome">
            <p class="text-red-400" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <input type="text" name="username" th:field="*{username}"
                   class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-green-600 focus:ring-2"
                   placeholder="Usuário">
            <p class="text-red-400" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

            <input type="email" name="email" th:field="*{email}"
                   class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-green-600 focus:ring-2"
                   placeholder="E-mail">
            <p class="text-red-400" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <input type="password" name="password" th:field="*{password}"
                   class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-green-600 focus:ring-2"
                   placeholder="Senha">
            <p class="text-red-400" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <input type="password" name="confirmPassword" th:field="*{confirmPassword}"
                   class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-green-600 focus:ring-2"
                   placeholder="Confirme sua senha">
            <p class="text-red-400" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

            <textarea placeholder="Digite uma breve descrição sobre você" th:field="*{description}"
                      class="w-full bg-white border text-gray-900 text-md rounded-md block p-3 focus:outline-none focus:ring-green-600 focus:ring-2">
            </textarea>

            <p class="text-red-400" th:if="${errorMessage}" th:text="${errorMessage}"></p>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="w-full bg-green-500 text-white p-3 rounded-md hover:bg-green-600 transition-colors duration-200">
                Cadastrar
            </button>
            <span class="w-full block text-center text-gray-400">
                        Já possui uma conta?
                        <a href="/candidate/login"
                           class="text-green-500 hover:text-green-600 transition-colors duration-200 underline underline-offset-2">Login</a>
            </span>
        </div>
    </form>

</div>

</body>
</html>
